# FW1 — FortiGate 7.0.9 — configuración inicial documentada
config system global
    set hostname FW1
end
config system interface
    edit "port1"
        set mode static
        set ip 203.0.113.22 255.255.255.252
        set allowaccess ping https ssh http telnet
        set alias "WAN-R1"
    next
    edit "port2"
        set mode static
        set ip 10.21.75.1 255.255.255.0
        set allowaccess ping https ssh http telnet
        set alias "LAN"
    next
end
config router static
    edit 1
        set gateway 203.0.113.21
        set device "port1"
    next
end
config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic disable
    next
end
